openapi: 3.0.0
info:
  title: Flights Service
  description: KongAir Flights service provides flight schedule information (flight number, route, and times).
  version: 0.1.0
servers:
  - url: https://api.kong-air.com
    description: KongAir public API server

# Plugins declared in the spec so `openapi2kong` generates them onto the Service.
# Everything Kong runs for this API therefore derives from this one file.
x-kong-plugin-rate-limiting:
  config:
    minute: 4
    policy: local
    limit_by: ip
x-kong-plugin-opentelemetry:
  config:
    traces_endpoint: http://localhost:4318/v1/traces
    logs_endpoint: http://localhost:4318/v1/logs
x-kong-plugin-prometheus:
  config:
    status_code_metrics: true
    latency_metrics: true
    bandwidth_metrics: true
    upstream_health_metrics: true

paths:
  /health:
    get:
      operationId: get-health
      summary: Health check endpoint
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
  /flights:
    get:
      operationId: get-flights
      summary: List flights
      parameters:
        - name: flight_date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: A list of flights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flight"
  /flights/{flightNumber}:
    get:
      operationId: get-flight-by-number
      summary: Get a flight by number
      parameters:
        - name: flightNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A single flight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flight"
        "404":
          description: Flight not found
components:
  schemas:
    Flight:
      type: object
      properties:
        number:
          type: string
          example: KD924
        route_id:
          type: string
          example: LHR-SFO
        scheduled_departure:
          type: string
          format: date-time
        scheduled_arrival:
          type: string
          format: date-time
