name: oidc-debug

# Temporary diagnostic. Prints the claims in the OIDC token GitHub issues, so we
# can compare the real `sub` and `aud` against the IAM role's trust policy.
# Delete this file once the trust handshake works. It never prints the raw token.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Decode OIDC claims
        run: |
          payload=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' | cut -d. -f2)
          # base64url -> base64 padding, then decode just the claims (not the token)
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          echo "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | jq '{sub, aud, repository, repository_owner, ref, workflow_ref}'
