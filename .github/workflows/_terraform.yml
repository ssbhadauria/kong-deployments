name: _terraform

# Reusable engine: init/fmt/validate/plan for one stack, and apply when asked.
# Called by terraform-plan.yml (apply=false) and terraform-apply.yml (apply=true).

on:
  workflow_call:
    inputs:
      stack_dir:
        description: "Stack path, e.g. terraform/10-konnect-platform"
        required: true
        type: string
      apply:
        description: "Apply the plan (true on main / manual dispatch)"
        required: false
        type: boolean
        default: false

# These are what the reusable workflow NEEDS. Every caller must grant at least
# this set (permissions can be downgraded but not elevated by a reusable
# workflow, and omitting them does NOT inherit the caller's — it drops to
# metadata-only, breaking OIDC + checkout). So terraform-plan.yml AND
# terraform-apply.yml both grant all three, even though only the plan path
# actually uses pull-requests (for the PR plan comment).
permissions:
  id-token: write # assume the AWS role via OIDC
  contents: read # checkout
  pull-requests: write # PR plan comment (plan path only)

env:
  AWS_REGION: us-east-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: ${{ inputs.stack_dir }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.stack_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      # If a stack ships a generate.sh (e.g. stack 30 turns the OAS into Kong
      # Terraform via deck openapi2kong -> kong2tf), run it before anything else.
      # No-op for stacks without one. It formats its own output so fmt passes.
      - name: Generate config (if the stack has a generator)
        run: |
          if [ -f generate.sh ]; then
            chmod +x generate.sh
            ./generate.sh
          else
            echo "no generate.sh in this stack — skipping"
          fi

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        env:
          TF_VAR_konnect_pat: ${{ secrets.KONNECT_TOKEN }}
          # Only used by stacks that declare it (e.g. 20-dataplane-ecs); harmless elsewhere.
          TF_VAR_grafana_otlp_token: ${{ secrets.GRAFANA_CLOUD_OTLP_TOKEN }}
        run: terraform plan -out=tfplan -no-color | tee plan.txt

      - name: Post plan to PR
        if: ${{ inputs.apply == false && github.event_name == 'pull_request' }}
        continue-on-error: true # a comment failure must never fail the plan
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('${{ inputs.stack_dir }}/plan.txt', 'utf8');
            const MAX = 60000;
            if (plan.length > MAX) plan = plan.slice(0, MAX) + '\n...(truncated)...';
            const body = `#### Terraform plan — \`${{ inputs.stack_dir }}\`\n`
              + `<details><summary>show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Apply
        if: ${{ inputs.apply == true }}
        env:
          TF_VAR_konnect_pat: ${{ secrets.KONNECT_TOKEN }}
          TF_VAR_grafana_otlp_token: ${{ secrets.GRAFANA_CLOUD_OTLP_TOKEN }}
        run: terraform apply -auto-approve tfplan
